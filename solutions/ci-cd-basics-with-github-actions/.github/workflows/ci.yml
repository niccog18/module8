# CI/CD Solution: GitHub Actions Workflow  (Solution)
# ======================================================
# File: .github/workflows/ci.yml
#
# Key concepts:
#
#   Trigger strategy (push + pull_request to main):
#     Runs CI on every push so bugs are caught immediately, and on every PR
#     so maintainers can see the status before merging.
#
#   Job ordering (test → docker → lint):
#     Linting after tests is a common pattern — a failing test is a higher
#     priority signal than a style warning. Docker build is gated on tests
#     so we never build a broken image.
#
#   pip cache:
#     actions/cache with the pip cache dir speeds up installs significantly
#     in CI and reduces egress costs on hosted runners.
#
#   docker/build-push-action with push: false:
#     Validates the Dockerfile can be built without pushing to a registry.
#     For a production pipeline you'd add push: true and supply registry creds.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Run tests ─────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: ./backend
        run: pip install -r requirements.txt pytest httpx

      - name: Run pytest
        working-directory: ./backend
        run: pytest tests/ -v

  # ── 2. Build Docker images ───────────────────────────────────────────────
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: rag-backend:latest

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: rag-frontend:latest

  # ── 3. Lint ──────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        run: ruff check ./backend ./frontend
